runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://fikrainaction.com
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_EMAILS
    value: goldensparkbh@gmail.com
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_ADMIN_EMAIL
    value: goldensparkbh@gmail.com
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: GEMINI_MODEL
    value: gemini-3.5-flash
    availability:
      - RUNTIME
  # The application also recognizes GOOGLE_API_KEY, GOOGLE_GENAI_API_KEY, and
  # GOOGLE_GENERATIVE_AI_API_KEY when supplied by an existing environment.
  - variable: YOUTUBE_API_KEY
    secret: YOUTUBE_API_KEY
    availability:
      - RUNTIME

# Firebase App Hosting automatically provides FIREBASE_CONFIG and
# FIREBASE_WEBAPP_CONFIG when this repository is connected to a Firebase web app.
# The application uses those values for Admin SDK and browser SDK initialization.

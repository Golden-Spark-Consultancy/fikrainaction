runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: FIREBASE_ADMIN_EMAILS
    value: goldensparkbh@gmail.com
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_ADMIN_EMAIL
    value: goldensparkbh@gmail.com
